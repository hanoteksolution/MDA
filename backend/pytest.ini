[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q
testpaths = tests apps
filterwarnings =
    ignore::DeprecationWarning
markers =
    unit: Fast isolated unit tests (services, models, helpers).
    integration: Multi-layer tests exercising HTTP API + services + DB.
    isolation: Cross-tenant boundary and scoping tests.
    critical: Business-critical path tests (POS, stock, gym, pharmacy).
