# Prometheus scrape config for MDA ERP (STEP 34)
#
# Assumes the app web proxy is reachable at host.docker.internal:8010
# (Docker Desktop / Linux with extra_hosts host-gateway).

global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: mda-health
    metrics_path: /api/v1/health/ready/
    static_configs:
      - targets: ["host.docker.internal:8010"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: mda-erp

  - job_name: mda-health-database
    metrics_path: /api/v1/health/database/
    static_configs:
      - targets: ["host.docker.internal:8010"]

  - job_name: mda-health-cache
    metrics_path: /api/v1/health/cache/
    static_configs:
      - targets: ["host.docker.internal:8010"]

# Note: endpoints return JSON, not Prometheus exposition format.
# Use blackbox_exporter or convert to metrics via a small sidecar for full metrics.
# These jobs are suitable for uptime polling via Prometheus JSON or external checks.
# For simple ops, prefer scripts/check_health.sh on cron.
