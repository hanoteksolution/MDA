# MDA ERP — wildcard tenant subdomains + platform apex
#
# Prerequisites:
#   1. DNS: A record  erp.safaritechno.com  → VPS IP
#   2. DNS: A record  *.erp.safaritechno.com → VPS IP  (wildcard)
#   3. Docker stack listening on 127.0.0.1:8010 (docker-compose + docker-compose.vps.yml)
#
# TLS option A — Let's Encrypt DNS wildcard (recommended for *.erp):
#   certbot certonly --manual --preferred-challenges dns \
#     -d erp.safaritechno.com -d *.erp.safaritechno.com
#   Add the _acme-challenge TXT records at your DNS provider when prompted.
#
# TLS option B — HTTP only on apex, per-tenant certs later (dev/staging):
#   Use the port-80 server block below without SSL.
#
# Deploy:
#   sudo cp wildcard-erp.safaritechno.com.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/wildcard-erp.safaritechno.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream mda_erp_web {
    server 127.0.0.1:8010;
    keepalive 32;
}

# Redirect HTTP → HTTPS (enable after certbot)
server {
    listen 80;
    listen [::]:80;
    server_name erp.safaritechno.com *.erp.safaritechno.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name erp.safaritechno.com *.erp.safaritechno.com;

    # certbot --nginx fills these, or set manually for DNS wildcard cert:
    ssl_certificate     /etc/letsencrypt/live/erp.safaritechno.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.safaritechno.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://mda_erp_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
