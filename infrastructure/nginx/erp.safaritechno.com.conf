# MDA ERP — host nginx proxies erp.safaritechno.com to Docker web (port 8010)
# DNS A record for erp must point to this VPS (88.222.220.238), not another host.
#
# Deploy:
#   sudo cp erp.safaritechno.com.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/erp.safaritechno.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d erp.safaritechno.com

upstream mda_erp_web {
    server 127.0.0.1:8010;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name erp.safaritechno.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://mda_erp_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
