# MDA ERP — apex + tenant subdomains (*.erp.safaritechno.com) → Docker web :8010
# DNS: A erp.safaritechno.com and A *.erp.safaritechno.com → this VPS
#
# Deploy:
#   sudo cp infrastructure/nginx/erp.safaritechno.com.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/erp.safaritechno.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: one DNS-01 wildcard covers every tenant subdomain, so a newly created
# workspace is valid HTTPS immediately with nothing provisioned per shop.
#   sudo install -m 0755 infrastructure/nginx/issue-wildcard-cert.sh /usr/local/sbin/issue-erp-wildcard
#   sudo /usr/local/sbin/issue-erp-wildcard
# See WILDCARD_TLS.md. The old per-tenant SAN expansion (sync-erp-cert.sh) is
# deprecated and must be disabled once the wildcard is live.

upstream mda_erp_web {
    server 127.0.0.1:8010;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name erp.safaritechno.com *.erp.safaritechno.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name erp.safaritechno.com *.erp.safaritechno.com;

    # DNS-01 wildcard: erp.safaritechno.com + *.erp.safaritechno.com
    # Managed by /usr/local/sbin/issue-erp-wildcard (acme.sh, Hostinger DNS).
    ssl_certificate /etc/ssl/mda/erp-wildcard/fullchain.pem;
    ssl_certificate_key /etc/ssl/mda/erp-wildcard/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://mda_erp_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
