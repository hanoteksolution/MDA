# MDA ERP — apex + tenant subdomains (*.erp.safaritechno.com) → Docker web :8010
# DNS: A erp.safaritechno.com and A *.erp.safaritechno.com → this VPS
#
# Deploy:
#   sudo cp infrastructure/nginx/erp.safaritechno.com.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/erp.safaritechno.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d erp.safaritechno.com -d arabica.erp.safaritechno.com --expand
#   sudo install -m 0755 infrastructure/nginx/sync-erp-cert.sh /usr/local/sbin/sync-erp-cert
#   (crontab) */15 * * * * /usr/local/sbin/sync-erp-cert >> /var/log/sync-erp-cert.log 2>&1
#
# Preferred long-term TLS (covers all shop subdomains):
#   certbot certonly --manual --preferred-challenges dns \
#     -d erp.safaritechno.com -d *.erp.safaritechno.com

upstream mda_erp_web {
    server 127.0.0.1:8010;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name erp.safaritechno.com *.erp.safaritechno.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name erp.safaritechno.com *.erp.safaritechno.com;

    ssl_certificate /etc/letsencrypt/live/erp.safaritechno.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.safaritechno.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://mda_erp_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
