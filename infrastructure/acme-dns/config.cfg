# acme-dns — challenge-only authoritative nameserver for ACME DNS-01.
#
# Why this exists: Let's Encrypt only issues wildcards via DNS-01, and the
# Hostinger DNS API refuses this account (collaborator access is not API
# ownership). acme-dns sidesteps that: a one-time CNAME points
# _acme-challenge.erp.safaritechno.com at a zone this server is authoritative
# for, so acme.sh can write TXT records forever without touching Hostinger.
#
# Blast radius is deliberately tiny: only _acme-challenge lookups reach this
# server. All tenant subdomain resolution stays with Hostinger, so if this
# service is down only certificate renewal is affected (30 days of slack),
# never the live ERP.

[general]
# Bind inside the container; the host publishes this on the public IP only.
listen = "0.0.0.0:53"
protocol = "both"
# The challenge-only zone delegated to this server.
domain = "acme.safaritechno.com"
nsname = "acmens.safaritechno.com"
nsadmin = "admin.safaritechno.com"
# Self-answered glue so the delegation resolves.
records = [
    "acme.safaritechno.com. A 88.222.220.238",
    "acme.safaritechno.com. NS acmens.safaritechno.com.",
    "acmens.safaritechno.com. A 88.222.220.238",
]
debug = false

[database]
engine = "sqlite3"
connection = "/var/lib/acme-dns/acme-dns.db"

[api]
ip = "0.0.0.0"
port = "8081"
# Registration is open only while the single account is created, then closed.
# See README.md — flip this to true and restart once registration is done.
disable_registration = false
tls = "none"
corsorigins = ["*"]
use_header = false
header_name = "X-Forwarded-For"

[logconfig]
loglevel = "info"
logtype = "stdout"
logformat = "text"
