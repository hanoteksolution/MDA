# Docker Compose — see repository root
#
# Production stack lives at ../../docker-compose.yml
#
#   docker compose -f ../../docker-compose.yml -f ../../docker-compose.staging.yml up -d --build
#
# Legacy minimal compose (API + DB only) — prefer root compose files.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ../../backend/.env.cloud
    environment:
      POSTGRES_DB: ${DB_NAME:-mda_erp}
      POSTGRES_USER: ${DB_USER:-mda}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - mda_pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../backend/.env.cloud
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
    volumes:
      - mda_media:/app/media

volumes:
  mda_pgdata:
  mda_media:
