# VPS overrides — public port 8010, nginx front-end
name: mda

services:
  db:
    ports:
      - "127.0.0.1:5437:5432"

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    image: mda-web
    container_name: mda_web
    restart: unless-stopped
    ports:
      - "8010:80"
    volumes:
      - mda_media:/var/www/media:ro
    depends_on:
      - api
